<style>
@font-face{font-family:Unbounded;src:url(unbounded.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:Manrope;src:url(manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#0C0C11; --surface:#15151D; --surface2:#1C1C26; --line:#272733;
  --text:#F4F2EC; --muted:#8C8A99; --dim:#5D5B69;
  --accent:#6B5CFF; --accent-soft:rgba(107,92,255,.16); --accent-2:#9C91FF;
  --saffron:#F5B53D; --saffron-soft:rgba(245,181,61,.14);
  --mint:#3DD68C; --mint-soft:rgba(61,214,140,.14);
  --red:#FF5C6C; --red-soft:rgba(255,92,108,.14);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:Manrope,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) 20px 24px}
.tabbar{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:rgba(12,12,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:9px 0 calc(var(--sb) + 6px)}
.tabbar.hide{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--dim);width:25%}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-2)}
h2{font-family:Unbounded;font-weight:700;font-size:23px;letter-spacing:-.3px}
h3{font-family:Unbounded;font-weight:700;font-size:17px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.saffron{background:var(--saffron-soft);color:var(--saffron)}
.chip.accent{background:var(--accent-soft);color:var(--accent-2)}
.chip.ghost{background:var(--surface2);color:var(--muted)}
.chip.mint{background:var(--mint-soft);color:var(--mint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.hero{background:linear-gradient(145deg,#2A2170 0%,#1A1640 55%,#15151D 100%);border:1px solid #3A3290;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hero .star{position:absolute;right:-30px;top:-30px;width:150px;opacity:.18;pointer-events:none}
.big{font-family:Unbounded;font-weight:800;font-size:44px;line-height:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;font-weight:800;font-size:15px;background:var(--accent);color:#fff;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(255,92,108,.35)}
.btn[disabled]{opacity:.4}
.ar{font-family:"Geeza Pro","Noto Naskh Arabic","Al Bayan",serif;direction:rtl}
.pr{font-family:Unbounded;font-weight:600;letter-spacing:-.2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left}
.tile:active{background:var(--surface2)}
.tile .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.tile h4{font-size:14.5px;font-weight:800}
.tile p{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.progress{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;display:flex}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .35s}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.close{font-size:24px;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;margin-left:-8px}
/* sesión */
.study{flex:1;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 20px calc(var(--sb) + 18px);min-height:0}
.study .face{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;overflow-y:auto;padding:10px 0}
.qes{font-family:Unbounded;font-weight:700;font-size:28px;line-height:1.22;letter-spacing:-.4px;max-width:330px}
.qpr{font-size:34px;color:var(--accent-2);line-height:1.15;word-break:break-word}
.qar{font-size:32px;line-height:1.5}
.answer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ans{border-radius:14px;padding:12px 4px;text-align:center;font-weight:800;font-size:13.5px}
.ans small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-top:3px}
.ans:active{transform:scale(.96)}
.tip{text-align:left;width:100%;padding:14px 16px}
.tip .t{color:var(--saffron);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800;margin-bottom:5px}
.tip p{font-size:13.5px;line-height:1.5;color:#CFCBD9}
.flag{font-size:12.5px;font-weight:800;color:var(--muted);padding:8px 12px;border-radius:999px;background:var(--surface2)}
.flag.on{color:var(--saffron);background:var(--saffron-soft)}
/* test */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;gap:10px}
.opt .ar{font-size:18px;color:var(--muted)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint)}
.opt.ko{border-color:var(--red);background:var(--red-soft);color:var(--red)}
/* emparejar */
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-weight:700;font-size:13.5px;min-height:58px;display:grid;place-items:center;transition:opacity .25s}
.m.r{font-family:Unbounded;font-weight:600;color:var(--accent-2);font-size:13px}
.m.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.m.done{opacity:.25;border-style:dashed;pointer-events:none}
.m.bad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* listado */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--muted)}
.search input{flex:1;background:none;border:none;outline:none;font-size:16px;font-weight:600;padding:13px 0;color:var(--text);-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{cursor:pointer}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.item .es{font-weight:700;font-size:14.5px}
.item .p{font-size:12.5px;color:var(--accent-2);font-family:Unbounded;font-weight:500;margin-top:3px}
.item .a{margin-left:auto;font-size:19px;color:var(--muted);flex:none;max-width:45%;text-align:left}
.detail{padding:4px 0 14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.detail p{font-size:13.5px;color:#CFCBD9;line-height:1.5}
/* progreso */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .n{font-family:Unbounded;font-weight:800;font-size:25px}
.stat .t{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:4px}
.bars i.z{background:var(--surface2)}
.bars i.t{background:var(--saffron)}
.catbar{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;font-size:12px;font-weight:700;margin-top:11px}
.catbar span:last-child{color:var(--muted);text-align:right}
/* hojas (ajustes, guía) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .panel{background:var(--bg);border-top:1px solid var(--line);border-radius:26px 26px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:18px 20px calc(var(--sb) + 22px)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:grid;grid-template-columns:48px 34px 1fr}
.legend>div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center}
.legend .k{font-family:Unbounded;font-weight:700;color:var(--accent-2);font-size:15px}
.legend .l{font-family:"Geeza Pro","Noto Naskh Arabic";font-size:21px;color:var(--saffron);justify-content:center}
.legend .d{display:block!important;color:var(--text);font-weight:600;padding-left:8px;line-height:1.35;font-size:13.5px}
.legend .d em{display:block;color:var(--accent-2);font-style:normal;font-family:Unbounded;font-size:11px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-weight:600;font-size:14px}
/* diálogos */
.chat{display:flex;flex-direction:column;gap:10px;padding:14px 0 10px}
.bub{max-width:86%;border-radius:20px;padding:12px 15px;border:1px solid var(--line)}
.bub.o{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.bub.t{align-self:flex-end;background:var(--accent-soft);border-color:#3A3290;border-bottom-right-radius:6px;text-align:right}
.bub .who{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.bub .bpr{font-family:Unbounded;font-weight:600;font-size:16px;color:var(--accent-2);line-height:1.3}
.bub .bar{font-family:"Geeza Pro","Noto Naskh Arabic","Al Bayan",serif;direction:rtl;font-size:19px;line-height:1.6;color:var(--text)}
.bub .bes{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.bub.ask .bes{font-size:15.5px;color:var(--text);font-weight:700;margin:0}
.bub.ask .hint{font-size:12px;color:var(--accent-2);font-weight:700;margin-top:6px}
.dl{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dl .n{width:34px;height:34px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-family:Unbounded;font-weight:700;font-size:12px;color:var(--muted);flex:none}
/* formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:800;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;color:var(--text);outline:none;-webkit-user-select:text;user-select:text;width:100%;font-family:inherit;-webkit-appearance:none;appearance:none}
.field textarea{min-height:70px;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field .ar{text-align:right}
.mini{font-size:12.5px;font-weight:800;color:var(--muted);padding:8px 12px;border-radius:999px;background:var(--surface2)}
.done-ico{width:84px;height:84px;border-radius:26px;background:var(--mint-soft);display:grid;place-items:center;margin:0 auto}

/* ================= v3: movimiento y acabado ================= */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1)}
.scroll{padding-bottom:calc(var(--sb) + 120px);scrollbar-width:none}
/* que ningún bloque se encoja cuando la pantalla se llena: se baja con scroll */
.scroll>*,.stack>*,.face>*{flex-shrink:0}
.hero{min-height:max-content}
.scroll::-webkit-scrollbar{display:none}
/* barra flotante de cristal con botón central */
.tabbar{position:fixed;left:14px;right:14px;bottom:calc(var(--sb) + 12px);height:70px;border-radius:28px;background:rgba(22,22,30,.72);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.09);box-shadow:0 14px 40px rgba(0,0,0,.55);align-items:center;padding:0 6px;z-index:20;transition:transform .35s var(--ease),opacity .25s;view-transition-name:tabbar}
.tabbar.hide{display:flex;transform:translateY(140%);opacity:0;pointer-events:none}
.tab{width:auto;flex:1;height:52px;justify-content:center;transition:color .25s}
.tab svg{transition:transform .35s var(--spring)}
.tab.on svg{transform:translateY(-2px) scale(1.08)}
.fab{position:relative;width:62px;height:62px;flex:none;margin-top:-30px;border-radius:22px;background:linear-gradient(145deg,#7B6CFF,#5A4BEA);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(107,92,255,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}
.fab .cnt{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--saffron);color:#0C0C11;font-size:11.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.fab .cnt[hidden]{display:none}
.fab.live::before{content:'';position:absolute;inset:0;border-radius:22px;border:2px solid var(--accent);animation:pulseRing 2.2s ease-out infinite}
/* entradas */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.up{animation:up .5s var(--ease) both}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pulseRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,22px) scale(1.12)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(10deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes barx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(45deg)}100%{transform:translateY(110vh) rotate(405deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes outL{to{opacity:0;transform:translateX(-40px) rotate(-2deg)}}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
@keyframes okPop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes matchOut{0%{transform:scale(1)}40%{transform:scale(1.08);background:var(--mint-soft);border-color:var(--mint)}100%{transform:scale(1);opacity:.25}}
/* bloque principal con brillos que se mueven */
.hero{background:linear-gradient(150deg,#241C66 0%,#17143A 55%,#121219 100%);box-shadow:0 20px 50px rgba(30,20,110,.35)}
.hero .glow{position:absolute;border-radius:50%;pointer-events:none;animation:drift 12s ease-in-out infinite}
.hero .g1{width:240px;height:240px;right:-80px;top:-90px;background:radial-gradient(circle,rgba(123,108,255,.55),rgba(123,108,255,0) 70%)}
.hero .g2{width:200px;height:200px;left:-70px;bottom:-110px;background:radial-gradient(circle,rgba(245,181,61,.28),rgba(245,181,61,0) 70%);animation-delay:-6s;animation-duration:15s}
.hero .star{animation:spinSlow 60s linear infinite;opacity:.14}
.hero>*:not(.glow):not(.star):not(.ring){position:relative}
.btn{box-shadow:0 10px 26px rgba(107,92,255,.35)}
.btn.ghost,.btn.danger{box-shadow:none}
.btn:active,.tile:active,.card.row:active,.dl:active,.item:active,.opt:active,.m:active,.ans:active{transform:scale(.97)}
.tile,.card.row,.dl,.item,.opt,.m,.ans,.chip,.iconbtn,.flag{transition:transform .15s,background-color .25s,border-color .25s,color .25s,opacity .25s}

}

function buildItems(){
  S.custom = S.custom||{}; S.edits = S.edits||{}; S.dintro = S.dintro||{};

  CATNAME = {}; CATS.forEach((c,i)=>{ CATNAME[c.id]=c.name; c.i=i; });
  const ci = Object.fromEntries(CATS.map(c=>[c.id,c.i]));
  const base = BASE.map(b=>{ const e=S.edits[b.id]; return e ? Object.assign({}, b, e, {edited:true}) : Object.assign({}, b); });
  const mine = Object.values(S.custom).map(c=>Object.assign({}, c, {custom:true}));

const nextNew = n => ORDER.filter(it=>!S.intro[it.id]).slice(0,n);

function orphanKeys(){

const TIPS = [
  [/3/, '<b>3</b> es la ع: un sonido de garganta apretada. Di una "a" apretando la garganta.'],
  [/7/, '<b>7</b> es la ح: una h fuerte, como cuando empañas un cristal.'],
  [/kh/, '<b>kh</b> es tu jota de siempre (خ).'],
  [/gh/, '<b>gh</b> suena como la r francesa (غ).'],
  [/q/, '<b>q</b> es una k que sale del fondo de la garganta (ق).'],
  [/sh/, '<b>sh</b> es la x catalana, la de «xocolata» (ش).'],
  [/(^|[^k])j/, '<b>j</b> es la j catalana, la de «jove». No es la jota (ج).'],
  [/z/, '<b>z</b> es una s que zumba. Nunca como la z castellana (ز).'],
  [/g(?!h)/, '<b>g</b> siempre suave, como en «gato», también delante de e o i.'],

function tipFor(it){
  const p = it.pr.toLowerCase(); const hits = TIPS.filter(([re])=>re.test(p));

}

/* ============ SESIÓN (repaso espaciado) ============ */
let SES=null;
function startSession(opt={}){
  const P=todayPlan(); let {due, orph, fresh}=P;
  if(opt.block){
    // bloque de 5 minutos: las más atrasadas primero y 2 o 3 frases nuevas
    fresh=fresh.slice(0, Math.min(3, fresh.length));
    orph=orph.slice(0, BLOCK);
    due=due.slice(0, Math.max(0, BLOCK - orph.length - fresh.length*dirs().length));
  }
  // las presentaciones se reparten entre los repasos, para que su pregunta pueda salir 3 o 4 tarjetas después
  const q=[...orph.map(k=>({key:k})), ...due.map(k=>({key:k}))];
  const L=q.length;
  fresh.forEach((it,i)=>{ const at = L>=5 ? Math.floor((i+1)*L/(fresh.length+1)) + i : q.length; q.splice(Math.min(at,q.length),0,{key:it.id+'|n', pres:true}); });
  if(!q.length){ toast('No hay nada pendiente'); return; }
  SES = { q, done:0, ok:0, again:0, rated:0, shown:false, mode:'srs', block:!!opt.block };
  if(current!=='study') go('study'); drawCard('in');
}
function sesLeft(){
  let n=0; const seen=new Set();
  for(const x of SES.q){ if(x.pres) n+=dirs().length; else if(!seen.has(x.key)){ seen.add(x.key); n++; } }
  return n;
}
function quitSession(){
  if(SES && SES.mode==='srs' && SES.rated>0){ toast(`${pl(SES.rated,'hecha','hechas')}, ya guardadas`); backupNow(false); }
  exitStudy();
}
function snap(keys, id){
  const cards={}; keys.forEach(k=>cards[k]=S.cards[k]?{...S.cards[k]}:null);
  return { q:SES.q.map(x=>({...x})), done:SES.done, ok:SES.ok, again:SES.again, rated:SES.rated,
    cards, id, intro:S.intro[id]||null, ds:{...dayStat()}, fails:[...((S.fails||{})[dayKey()]||[])] };
}

function attachSwipe(el, onL, onR){
  el.classList.add('sw');
  const sl=el.querySelector('.stamp.l'), sr=el.querySelector('.stamp.r'), TH=100;
  let x0=null, y0=0, dx=0, lock=null, over=false;
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; x0=e.clientX; y0=e.clientY; dx=0; lock=null; el.style.transition='none'; });
  el.addEventListener('pointermove',e=>{
    if(x0===null) return; const mx=e.clientX-x0, my=e.clientY-y0;
    if(lock===null && (Math.abs(mx)>8||Math.abs(my)>8)) lock = Math.abs(mx)>Math.abs(my)?'x':'y';
    if(lock!=='x') return;
    dx=mx; el.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;
    const k=Math.min(1,Math.abs(dx)/TH); sr.style.opacity=dx>0?k:0; sl.style.opacity=dx<0?k:0;
    const o=Math.abs(dx)>TH; if(o&&!over) haptic(); over=o;
  });
  const end=()=>{
    if(x0===null) return; x0=null;
    if(lock==='x' && Math.abs(dx)>TH){
      const d=dx>0?1:-1; el.style.transition='transform .25s ease-in, opacity .25s ease-in';
      el.style.transform=`translateX(${d*130}%) rotate(${d*16}deg)`; el.style.opacity='0';
      S.settings.swiped=(S.settings.swiped||0)+1;
      setTimeout(()=> d>0?onR():onL(), 190);
    } else {
      el.style.transition='transform .5s cubic-bezier(.3,1.4,.5,1)'; el.style.transform='';
      sl.style.opacity=0; sr.style.opacity=0;
    }
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}

function undoRate(){

function rate(g, flown){
  const now=new Date(); const key=SES.q[0].key; const id=key.split('|')[0];

  if(g===1){ SES.again++; const t=dayKey(); S.fails[t]=S.fails[t]||[]; if(!S.fails[t].includes(key)) S.fails[t].push(key); }

function makeQ(it){
  const dir = Math.random()<.5 ? 'r':'p';
  const val = x => dir==='r' ? x.es : x.pr;
  const same = shuffle(ITEMS.filter(x=>x.cat===it.cat && x.id!==it.id && val(x)!==val(it)));
  const other = shuffle(ITEMS.filter(x=>x.cat!==it.cat && val(x)!==val(it)));
  const ds=[]; for(const x of [...same,...other]){ if(ds.length===3) break; if(!ds.some(y=>val(y)===val(x))) ds.push(x); }
  return { it, dir, opts: shuffle([it,...ds]) };
}

let MATCH=null, MATCH_T=null;
function startMatch(){
  const p=pool(); const byCat={}; p.forEach(it=>(byCat[it.cat]=byCat[it.cat]||[]).push(it));
  const cats=Object.keys(byCat).filter(c=>new Set(byCat[c].map(x=>x.pr)).size>=5);
  let src, title;
  if(cats.length){ const c=cats[Math.floor(Math.random()*cats.length)]; src=byCat[c]; title=CATNAME[c]; } else { src=p; title='Mezcla'; }
  const pick=[]; for(const it of shuffle(src)){ if(pick.length===5) break; if(!pick.some(x=>x.pr===it.pr||x.es===it.es)) pick.push(it); }
  MATCH={ pick, L:shuffle(pick), Rr:shuffle(pick), done:new Set(), sel:null, start:Date.now(), title, errors:0 };
  go('study'); drawMatch();
  clearInterval(MATCH_T); MATCH_T=setInterval(()=>{ const t=$('#m-time'); if(t&&MATCH) t.textContent=mmss(Date.now()-MATCH.start); },1000);
}
const mmss = ms => { const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${pad(s%60)}`; };

      <h2>Hecho en ${mmss(Date.now()-M.start)}</h2><div class="sub">${M.errors} ${M.errors===1?'fallo':'fallos'}</div></div>
      <div class="stack" style="gap:10px"><button class="btn" id="b-again">Otra ronda</button><button class="btn ghost" id="b-end">Volver</button></div>`;
    $('#b-again').onclick=startMatch; $('#b-end').onclick=exitStudy;
    celebrate({ title:`Hecho en ${mmss(Date.now()-M.start)}`, stats:[[M.pick.length,'parejas','var(--mint)'],[M.errors,M.errors===1?'fallo':'fallos','var(--saffron)']], btn:'Seguir', party:M.errors<=1 });
    return;
  }
  const first=!M.drawn; M.drawn=true;
  const cell=(it,side,k)=>{ const d=M.done.has(it.id); const s=M.sel&&M.sel.side===side&&M.sel.id===it.id;
    return `<button class="m ${side==='r'?'r':''} ${d?'done':''} ${d&&M.just===it.id?'just':''} ${s?'sel':''} ${first?'up':''}" style="animation-delay:${k*.04}s" data-side="${side}" data-id="${it.id}">${side==='l'?esc(it.es):prH(it.pr)}</button>`; };
  let grid=''; for(let k=0;k<M.pick.length;k++) grid+=cell(M.L[k],'l',k*2)+cell(M.Rr[k],'r',k*2+1);
  el.innerHTML=`<div class="row" style="margin-bottom:6px"><button class="close" id="b-x">${IC.x}</button><span class="sub" id="m-time">${mmss(Date.now()-M.start)}</span></div>
    <div style="margin:4px 0 16px"><h3>Une las parejas</h3><div class="sub" style="margin-top:4px">${esc(M.title)}</div></div>
    <div class="match">${grid}</div>
    <div style="flex:1"></div>
    <div class="card" style="display:flex;gap:12px;align-items:center"><span class="chip accent">${M.done.size} / ${M.pick.length}</span><span class="sub">Toca una palabra de cada lado</span></div>`;
  $('#b-x').onclick=exitStudy;
  el.querySelectorAll('.m').forEach(b=>b.onclick=()=>{
    const side=b.dataset.side, id=b.dataset.id;
    if(!M.sel || M.sel.side===side){ M.sel={side,id}; M.just=null; return drawMatch(); }
    if(M.sel.id===id){ M.done.add(id); M.just=id; M.sel=null; haptic(); return drawMatch(); }
    M.errors++; const other=el.querySelector(`.m[data-side="${M.sel.side}"][data-id="${M.sel.id}"]`);
    b.classList.add('bad'); other&&other.classList.add('bad'); M.sel=null;
    setTimeout(drawMatch,420);
  });
}

/* ============ PROGRESO ============ */
function bestStreak(){
  const ks=Object.keys(S.days).filter(k=>S.days[k].rev>0).sort(); let best=0, run=0, prev=null;
  for(const k of ks){ const d=new Date(k+'T12:00'); run = prev && Math.round((d-prev)/864e5)===1 ? run+1 : 1; best=Math.max(best,run); prev=d; }
  return best;
}
function weekStats(offset){
  // semana de lunes a domingo; offset 0 = esta, 1 = la anterior (hasta el mismo día de la semana)
  const t=new Date(); const wd=(t.getDay()+6)%7; const r={rev:0,ok:0,nw:0,days:0};
  for(let k=0;k<=wd;k++){ const d=new Date(t); d.setDate(t.getDate()-wd+k-7*offset); const x=S.days[dayKey(d)]; if(x&&x.rev){ r.rev+=x.rev; r.ok+=x.ok||0; r.nw+=x.nw||0; r.days++; } }
  r.pct = r.rev ? Math.round(r.ok/r.rev*100) : 0; r.span=wd+1; return r;
}
document.addEventListener('click',e=>{ if(e.target.closest('#b-first')) $('#fab').click(); });
function renderProg(){
  const st={new:0,learn:0,dom:0}; const per={};
  ITEMS.forEach(it=>{ const s=status(it.id); st[s]++; const p=per[it.cat]||(per[it.cat]={n:0,learn:0,dom:0}); p.n++; if(s!=='new') p[s]++; });
  const total=Object.values(S.days).reduce((a,d)=>a+(d.rev||0),0);
  const okr=Object.values(S.days).reduce((a,d)=>a+(d.ok||0),0);
  const sk=streak(), best=bestStreak();
  const w=weekStats(0), pw=weekStats(1);
  const delta=(a,b)=>{ if(!b) return ''; const p=Math.round((a-b)/b*100); return p===0?'':`<em style="color:${p>0?'var(--mint)':'var(--red)'}">${p>0?'+':''}${p}%</em>`; };
  // calendario: 18 semanas, columnas de lunes a domingo
  const WEEKS=18, today=new Date(); today.setHours(12,0,0,0);
  const start=new Date(today); start.setDate(today.getDate()-((today.getDay()+6)%7)-7*(WEEKS-1));
  const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  let cells='', months='', lastM=-1;
  for(let c=0;c<WEEKS;c++){
    const col=new Date(start); col.setDate(start.getDate()+c*7);
    months += `<span>${col.getMonth()!==lastM?MES[col.getMonth()]:''}</span>`; lastM=col.getMonth();
    for(let r=0;r<7;r++){
      const d=new Date(start); d.setDate(start.getDate()+c*7+r);
      if(d>today){ cells+='<i class="f"></i>'; continue; }
      const k=dayKey(d), v=S.days[k]?.rev||0;
      const lv = !v?'':v<10?'l1':v<25?'l2':v<50?'l3':'l4';
      cells+=`<i class="${lv} ${k===dayKey()?'t':''}" data-day="${k}" data-v="${v}" style="animation-delay:${(.2+c*.025).toFixed(3)}s"></i>`;
    }
  }
  $('#prog').innerHTML=`<h2>Progreso</h2>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="stat"><div class="n" style="color:var(--mint)" data-cu="${st.dom}">${st.dom}</div><div class="t">Dominadas</div></div>
    <div class="stat"><div class="n" style="color:var(--saffron)" data-cu="${st.learn}">${st.learn}</div><div class="t">Aprendiendo</div></div>
    <div class="stat"><div class="n" data-cu="${st.new}">${st.new}</div><div class="t">Por ver</div></div>
  </div>
  ${total?`  <div class="card">
    <div class="row"><span style="font-weight:800;font-size:14px">Esta semana</span><span class="sub" style="font-size:12px">vs. la anterior hasta hoy</span></div>
    <div class="wk">
      <div><b data-cu="${w.rev}">${w.rev}</b><span>${w.rev===1?'repaso':'repasos'}</span>${delta(w.rev,pw.rev)}</div>
      <div><b><span data-cu="${w.days}">${w.days}</span><span style="font-size:13px;color:var(--muted)"> / ${w.span}</span></b><span>días estudiados</span></div>
      <div><b data-cu="${w.nw}">${w.nw}</b><span>${w.nw===1?'frase nueva':'frases nuevas'}</span>${delta(w.nw,pw.nw)}</div>
      <div><b>${w.pct}%</b><span>acertadas</span>${pw.rev&&w.rev?`<em style="color:${w.pct>=pw.pct?'var(--mint)':'var(--red)'}">${w.pct>=pw.pct?'+':''}${w.pct-pw.pct} pts</em>`:''}</div>
    </div>
  </div>`:`<div class="card empty0"><div class="eico"><svg width="22" height="22" viewBox="0 0 24 24"><polygon points="12,1 15.1,4.52 19.78,4.22 19.48,8.9 23,12 19.48,15.1 19.78,19.78 15.1,19.48 12,23 8.9,19.48 4.22,19.78 4.52,15.1 1,12 4.52,8.9 4.22,4.22 8.9,4.52" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div><div><b>Aquí verás cada semana</b><p>Tus repasos, los días que estudias y cuánto aciertas, comparados con la semana anterior.</p></div><button class="btn" id="b-first">Empezar la primera sesión</button></div>`}
  <div class="card">
    <div class="row"><span style="font-weight:800;font-size:14px">Actividad</span><span class="chip ${sk?'saffron':'zero'}">${sk} ${sk===1?'día seguido':'días seguidos'}</span></div>
    <div class="hmonths" style="grid-template-columns:repeat(${WEEKS},1fr)">${months}</div>
    <div class="heat" id="heat" style="grid-template-columns:repeat(${WEEKS},1fr)">${cells}</div>
    <div class="row" style="margin-top:10px"><span class="sub" style="font-size:12px">Mejor racha: ${best} ${best===1?'día':'días'}</span>
      <div class="hleg" style="margin:0">Menos<i style="background:var(--surface2)"></i><i style="background:rgba(107,92,255,.32)"></i><i style="background:rgba(107,92,255,.55)"></i><i style="background:rgba(123,108,255,.8)"></i><i style="background:#9C91FF"></i>Más</div></div>
    <div class="row sub" style="margin-top:12px;font-size:12px;padding-top:12px;border-top:1px solid var(--line)"><span>${pl(total,'repaso','repasos')} en total</span><span>${total?Math.round(okr/total*100):0}% acertados</span></div>
  </div>
  <div class="card">
    <span style="font-weight:800;font-size:14px">Por tema</span>
    <div class="sub" style="font-size:11.5px;margin-top:4px"><span style="color:var(--mint)">■</span> dominadas · <span style="color:var(--accent-2)">■</span> aprendiendo</div>
    ${CATS.filter(c=>per[c.id]).map((c,i)=>{ const p=per[c.id]; return `<div class="catbar"><span>${esc(c.name)}</span><div class="progress"><i style="width:${p.dom/p.n*100}%;background:var(--mint);border-radius:0;animation-delay:${.3+i*.03}s"></i><i style="width:${p.learn/p.n*100}%;border-radius:0;animation-delay:${.3+i*.03}s"></i></div><span>${p.dom+p.learn}/${p.n}</span></div>`; }).join('')}
  </div>`;
  $('#heat').onclick=e=>{ const c=e.target.closest('[data-day]'); if(!c) return;
    const d=new Date(c.dataset.day+'T12:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
    haptic(); toast(`${d}: ${c.dataset.v} ${c.dataset.v==='1'?'repaso':'repasos'}`); };
}

    const j=await driveGet('restore');
    if(!j||!j.ok){ toast('No se ha podido restaurar: '+(j&&j.error||'sin conexión')); return; }
    if(!applyBackup(j.data)){ toast('La copia de Drive no es válida'); return; }
    closeSheet('sh-settings'); go('home'); toast('Progreso restaurado desde Drive');
  };
  $('#s-imp').onclick=()=>$('#s-file').click();
  $('#s-file').onchange=importData;
  let armed=false;
  $('#s-reset').onclick=e=>{
    if(!armed){ armed=true; e.target.textContent='Toca otra vez para confirmar'; setTimeout(()=>{armed=false; if($('#s-reset')) $('#s-reset').textContent='Borrar todo el progreso';},3000); return; }
    S=DEFAULT(); buildItems(); save(); closeSheet('sh-settings'); go('home'); toast('Progreso borrado');
  };
}
async function exportData(){
  const name=`darija-copia-${dayKey()}.json`;
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('Copia descargada');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.cards||!d.intro) throw 0;
      applyBackup(d); closeSheet('sh-settings'); go('home'); toast('Copia importada');
    }catch(err){ toast('Ese archivo no es una copia válida'); } };
  r.readAsText(f); e.target.value='';
}


/* ============ DIÁLOGOS ============ */
function dlgDue(id){ const c=S.cards['dlg|'+id]; return c && new Date(c.due).getTime()<=endOfToday().getTime(); }
function dlgState(id){
  const c=S.cards['dlg|'+id];
  if(!c) return {txt:'Nuevo', cls:'ghost'};
  if(dlgDue(id)) return {txt:'Toca hoy', cls:'saffron'};
  const days=Math.max(1,Math.round((new Date(c.due)-new Date())/864e5));
  return {txt:`en ${days} d`, cls:'mint'};
}
function dlgToday(){
  const due=DLG.filter(d=>dlgDue(d.id));
  if(due.length) return {d:due[0], kind:'Repaso'};
  if(!Object.values(S.dintro).includes(dayKey())){
    const nx=[...DLG].sort((a,b)=>a.lvl-b.lvl).find(d=>!S.dintro[d.id]);
    if(nx) return {d:nx, kind:'Nuevo'};
  }
  return null;
}
function dlgCard(){
  if(!DLG.length) return '';
  const t=dlgToday();
  const ico=`<div style="width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9C91FF" stroke-width="2.2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12z"/></svg></div>`;
  if(!t){ const done=DLG.filter(d=>S.dintro[d.id]).length;
    return `<button class="card row" id="b-dlgs" style="width:100%;text-align:left;justify-content:flex-start;gap:14px">${ico}<div style="flex:1"><div class="sub">Diálogos</div><div style="font-weight:800;margin-top:2px">${done} de ${DLG.length} practicados</div></div><span class="chip mint">Hecho</span></button>`; }
  return `<button class="card row" id="b-dlg" data-id="${t.d.id}" style="width:100%;text-align:left;justify-content:flex-start;gap:14px">${ico}<div style="flex:1"><div class="sub">Diálogo de hoy</div><div style="font-weight:800;margin-top:2px;font-size:15.5px">${esc(t.d.title)}</div><div class="sub" style="font-size:12px;margin-top:2px">${esc(t.d.place)}</div></div><span class="chip ${t.kind==='Nuevo'?'accent':'saffron'}">${t.kind}</span></button>`;
}
let DS=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function startDialog(id){
  const d=DBY[id]; if(!d) return;
  DS={d, shown:0, revealed:false, finished:false, typing:d.lines[0].w==='o', pin:new Set()};
  go('study'); drawDialog(); playOthers();
}
// las frases del otro aparecen de una en una, con el "escribiendo..." antes
async function playOthers(){
  const me=DS; if(!me) return; const L=me.d.lines;
  while(DS===me && me.shown<L.length && L[me.shown].w==='o'){
    me.typing=true; drawDialog(); await sleep(reduceMotion?0:(me.shown===0?500:750));
    if(DS!==me) return;
    me.typing=false; me.pin.add(me.shown); me.shown++; me.finished=me.shown>=L.length; haptic(); drawDialog(); await sleep(reduceMotion?0:260);
  }
  if(DS!==me) return;
  me.finished = me.shown>=L.length; me.askPin=true; drawDialog();
}
function bubble(l, who, pin){
  return `<div class="bub ${l.w} ${pin?'pin':''}"><div class="who">${esc(who)}</div><div class="bpr">${prH(l.pr)}</div><div class="bar">${esc(l.ar)}</div><div class="bes">${esc(l.es)}</div></div>`;
}
function drawDialog(){
  const d=DS.d, L=d.lines, el=$('#study');
  let chat=''; for(let k=0;k<DS.shown;k++){ chat+=bubble(L[k], L[k].w==='o'?d.other:'Tú', DS.pin.has(k)); }
  DS.pin.clear();
  let foot;
  if(DS.typing){
    chat += `<div class="typing"><i></i><i></i><i></i></div>`;
    foot = `<button class="btn ghost" disabled>${esc(d.other)} está escribiendo…</button>`;
  } else if(!DS.finished && L[DS.shown]){
    const cur=L[DS.shown];
    chat += DS.revealed ? bubble(cur,'Tú',true)
      : `<div class="bub t ask ${DS.askPin?'pin':''}"><div class="who">Tú</div><div class="bes">${esc(cur.es)}</div><div class="hint">Dilo en voz alta en darija</div></div>`;
    DS.askPin=false;
    foot = DS.revealed ? `<button class="btn up" id="d-next">Seguir</button>` : `<button class="btn" id="d-show">Ver cómo se dice</button>`;
  } else {
    const key='dlg|'+d.id; const now=new Date(); const c=getCard(key)||FSRS.createEmptyCard(now); const pv=FD.repeat(c,now);
    const iv=g=>fmtIv(pv[g].card.due-now);
    foot = `<div class="sub" style="text-align:center;margin-bottom:10px">¿Qué tal te ha salido tu parte?</div>
    <div class="answer">
      <button class="ans" style="background:var(--red-soft);color:var(--red)" data-dg="1">Otra vez<small>${iv(1)}</small></button>
      <button class="ans" style="background:var(--saffron-soft);color:var(--saffron)" data-dg="2">Difícil<small>${iv(2)}</small></button>
      <button class="ans" style="background:var(--mint-soft);color:var(--mint)" data-dg="3">Bien<small>${iv(3)}</small></button>
      <button class="ans" style="background:var(--accent-soft);color:var(--accent-2)" data-dg="4">Fácil<small>${iv(4)}</small></button></div>`;
  }
  const tTurns=L.filter(x=>x.w==='t').length, tDone=L.slice(0,DS.shown).filter(x=>x.w==='t').length;
  el.innerHTML=`<div class="row" style="margin-bottom:6px"><button class="close" id="b-x">${IC.x}</button><span class="sub">Tu turno ${Math.min(tDone+1,tTurns)} de ${tTurns}</span></div>
    <div class="progress"><i style="width:${(DS.finished?1:tDone/tTurns)*100}%"></i></div>
    <div style="margin-top:12px"><h3>${esc(d.title)}</h3><div class="sub" style="margin-top:3px">${esc(d.place)} · hablas con: ${esc(d.other)}</div></div>
    <div class="face" id="d-scroll" style="justify-content:flex-start;align-items:stretch;text-align:left;gap:0;margin-top:8px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px);mask-image:linear-gradient(to bottom,transparent 0,#000 22px)"><div class="chat">${chat}</div></div>${foot}`;
  const sc=$('#d-scroll'); sc.scrollTop=sc.scrollHeight;
  $('#b-x').onclick=()=>{ DS=null; exitStudy(); };
  if($('#d-show')) $('#d-show').onclick=()=>{ DS.revealed=true; haptic(); drawDialog(); };
  if($('#d-next')) $('#d-next').onclick=()=>{ DS.shown++; DS.revealed=false; playOthers(); };
  el.querySelectorAll('[data-dg]').forEach(b=>b.onclick=()=>{
    const g=+b.dataset.dg, key='dlg|'+d.id, now=new Date();
    const c=getCard(key)||FSRS.createEmptyCard(now); putCard(key, FD.repeat(c,now)[g].card);
    if(!S.dintro[d.id]) S.dintro[d.id]=dayKey();
    bump(g>=3);
    save(); backupNow(false); DS=null;
    if(g===1){ toast('Lo repetimos mañana'); exitStudy(); }
    else celebrate({ title:'Diálogo completado', sub:`<b>${esc(d.title)}</b> vuelve en ${fmtIv(new Date(S.cards[key].due)-now)}.`, btn:'Volver', onClose:exitStudy, party:g>=3 });
  });
}

/* ============ AÑADIR / CORREGIR FRASES ============ */
function openForm(id, after){
  const it = id ? BY[id] : null;
  const isBase = it && !it.custom;
  const orig = isBase ? BASE.find(b=>b.id===id) : null;
  const cats = CATS.map(c=>`<option value="${c.id}" ${(it?it.cat:'mias')===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  $('#form').innerHTML = `<div class="grab"></div>
    <div class="row"><h3>${!it?'Nueva frase':isBase?'Corregir frase':'Editar tu frase'}</h3><button class="close" data-close="sh-form">${IC.x}</button></div>
    ${isBase?`<div class="sub" style="line-height:1.5">Tu corrección sustituye a la original en todas partes y conserva tu progreso. Siempre puedes volver a la original.</div>`:''}
    ${!it?`<div class="sub" style="line-height:1.5">Entrará en tu próxima sesión, sin gastar el cupo de frases nuevas.</div>`:''}
    <div class="field"><label>En español</label><input id="f-es" value="${esc(it?it.es:'')}" placeholder="¿Qué tal estás?" autocomplete="off"></div>
    <div class="field"><label>Pronunciación</label><input id="f-pr" value="${esc(it?it.pr:'')}" placeholder="kidayr?" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>En árabe (opcional)</label><input id="f-ar" class="ar" dir="rtl" value="${esc(it?it.ar:'')}" placeholder="كيداير؟" autocomplete="off"></div>
    <div class="field"><label>Nota (opcional)</label><textarea id="f-nota" placeholder="Quién te la dijo, en qué situación...">${esc(it?it.nota||'':'')}</textarea></div>
    ${!isBase?`<div class="field"><label>Tema</label><select id="f-cat">${cats}</select></div>`:''}
    <button class="btn" id="f-save">Guardar</button>
    ${isBase&&it.edited?`<button class="btn ghost" id="f-restore">Volver a la original${orig?` (${esc(orig.pr)})`:''}</button>`:''}
    ${it&&it.custom?`<button class="btn danger" id="f-del">Borrar esta frase</button>`:''}`;
  openSheet('sh-form');
  const done=msg=>{ buildItems(); save(); closeSheet('sh-form'); backupNow(false); toast(msg); if(after) after(); else if(current!=='study') go(current); };
  $('#f-save').onclick=()=>{
    const es=$('#f-es').value.trim(), pr=$('#f-pr').value.trim(), ar=$('#f-ar').value.trim(), nota=$('#f-nota').value.trim();
    if(!es||!pr){ toast('Pon al menos el español y la pronunciación'); return; }
    if(!it){
      const nid='mia-'+Date.now().toString(36);
      S.custom[nid]={id:nid, cat:$('#f-cat').value, lvl:1, es, pr, ar, nota};
      done('Añadida: sale en tu próxima sesión');
    } else if(it.custom){
      Object.assign(S.custom[id],{es,pr,ar,nota,cat:$('#f-cat').value}); done('Guardada');
    } else {
      S.edits[id]={es,pr,ar,nota}; delete S.flags[id]; done('Corregida');
    }
  };
  if($('#f-restore')) $('#f-restore').onclick=()=>{ delete S.edits[id]; done('Vuelve a estar la original'); };
  let armed=false;
  if($('#f-del')) $('#f-del').onclick=e=>{
    if(!armed){ armed=true; e.target.textContent='Toca otra vez para borrarla'; return; }
    delete S.custom[id]; delete S.intro[id]; delete S.flags[id]; delete S.cards[id+'|r']; delete S.cards[id+'|p'];
    LF.open=null; done('Frase borrada');
  };
}

/* ============ COPIA EN DRIVE ============ */
async function driveGet(action){
  if(!CFG.url||!CFG.token) return {ok:false,error:'falta la URL o la clave'};
  try{ const r=await fetch(`${CFG.url}?action=${action}&token=${encodeURIComponent(CFG.token)}&t=${Date.now()}`); return await r.json(); }
  catch(e){ return {ok:false,error:'sin conexión o URL incorrecta'}; }
}
let backingUp=false;
async function backupNow(manual){
  if(!CFG.url||!CFG.token){ if(manual) toast('Configura primero la URL y la clave'); return false; }
  if(backingUp) return false; backingUp=true;
  try{
    const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CFG.token, day:dayKey(), data:S})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'error');
    CFG.last=new Date().toISOString(); CFG.dirty=false; saveCfg();
    if(manual) toast('Copia guardada en Drive');
    return true;
  }catch(e){ CFG.dirty=true; saveCfg(); if(manual) toast('No se ha podido copiar: '+(e.message||'sin conexión')); return false; }
  finally{ backingUp=false; }
}
function applyBackup(d){
  if(!d||!d.cards||!d.intro) return false;
  S=Object.assign(DEFAULT(),d,{settings:Object.assign(DEFAULT().settings,d.settings||{})});
  buildItems(); save(); return true;
}
// al salir de la app, si hay cambios sin copiar, se envían en segundo plano
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && CFG.url && CFG.token && CFG.dirty && navigator.sendBeacon){
    try{ navigator.sendBeacon(CFG.url, new Blob([JSON.stringify({token:CFG.token, day:dayKey(), data:S})],{type:'text/plain;charset=utf-8'})); }catch(e){}
  }
});
window.addEventListener('online',()=>{ if(CFG.dirty) backupNow(false); });

/* ============ arranque ============ */
$('#home').innerHTML='<div class="sk" style="height:52px"></div><div class="sk" style="height:200px"></div><div class="sk" style="height:84px"></div><div class="sk" style="height:110px"></div>';
loadData().then(()=>{ go('home'); if(CFG.dirty) backupNow(false); }).catch(()=>{ $('#home').innerHTML='<div class="empty">No se ha podido cargar la base de datos. Abre la app con conexión una vez.</div>'; });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && current!=='study' && ITEMS.length && !document.querySelector('.sheet.on')) go(current); });
let reloadPending=false;
if('serviceWorker' in navigator){
  let hadCtrl=!!navigator.serviceWorker.controller, reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCtrl){ hadCtrl=true; return; } if(reloading) return;
    if(current==='study'){ reloadPending=true; return; }
    reloading=true; location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); });
}
</script>
