<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Darija</title>
<meta name="theme-color" content="#0C0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darija">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C11; --surface:#15151D; --surface2:#1C1C26; --line:#272733;
  --text:#F4F2EC; --muted:#8C8A99; --dim:#5D5B69;
  --accent:#6B5CFF; --accent-soft:rgba(107,92,255,.16); --accent-2:#9C91FF;
  --saffron:#F5B53D; --saffron-soft:rgba(245,181,61,.14);
  --mint:#3DD68C; --mint-soft:rgba(61,214,140,.14);
  --red:#FF5C6C; --red-soft:rgba(255,92,108,.14);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:Manrope,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) 20px 24px}
.tabbar{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:rgba(12,12,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:9px 0 calc(var(--sb) + 6px)}
.tabbar.hide{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--dim);width:25%}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-2)}
h2{font-family:Unbounded;font-weight:700;font-size:23px;letter-spacing:-.3px}
h3{font-family:Unbounded;font-weight:700;font-size:17px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.saffron{background:var(--saffron-soft);color:var(--saffron)}
.chip.accent{background:var(--accent-soft);color:var(--accent-2)}
.chip.ghost{background:var(--surface2);color:var(--muted)}
.chip.mint{background:var(--mint-soft);color:var(--mint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.hero{background:linear-gradient(145deg,#2A2170 0%,#1A1640 55%,#15151D 100%);border:1px solid #3A3290;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hero .star{position:absolute;right:-30px;top:-30px;width:150px;opacity:.18;pointer-events:none}
.big{font-family:Unbounded;font-weight:800;font-size:44px;line-height:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;font-weight:800;font-size:15px;background:var(--accent);color:#fff;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(255,92,108,.35)}
.btn[disabled]{opacity:.4}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro",serif;direction:rtl}
.pr{font-family:Unbounded;font-weight:600;letter-spacing:-.2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left}
.tile:active{background:var(--surface2)}
.tile .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.tile h4{font-size:14.5px;font-weight:800}
.tile p{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.progress{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;display:flex}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .35s}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.close{font-size:24px;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;margin-left:-8px}
/* sesión */
.study{flex:1;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 20px calc(var(--sb) + 18px);min-height:0}
.study .face{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;overflow-y:auto;padding:10px 0}
.qes{font-family:Unbounded;font-weight:700;font-size:28px;line-height:1.22;letter-spacing:-.4px;max-width:330px}
.qpr{font-size:34px;color:var(--accent-2);line-height:1.15;word-break:break-word}
.qar{font-size:32px;line-height:1.5}
.answer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ans{border-radius:14px;padding:12px 4px;text-align:center;font-weight:800;font-size:13.5px}
.ans small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-top:3px}
.ans:active{transform:scale(.96)}
.tip{text-align:left;width:100%;padding:14px 16px}
.tip .t{color:var(--saffron);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800;margin-bottom:5px}
.tip p{font-size:13.5px;line-height:1.5;color:#CFCBD9}
.flag{font-size:12.5px;font-weight:800;color:var(--muted);padding:8px 12px;border-radius:999px;background:var(--surface2)}
.flag.on{color:var(--saffron);background:var(--saffron-soft)}
/* test */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;gap:10px}
.opt .ar{font-size:18px;color:var(--muted)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint)}
.opt.ko{border-color:var(--red);background:var(--red-soft);color:var(--red)}
/* emparejar */
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-weight:700;font-size:13.5px;min-height:58px;display:grid;place-items:center;transition:opacity .25s}
.m.r{font-family:Unbounded;font-weight:600;color:var(--accent-2);font-size:13px}
.m.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.m.done{opacity:.25;border-style:dashed;pointer-events:none}
.m.bad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* listado */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--muted)}
.search input{flex:1;background:none;border:none;outline:none;font-size:16px;font-weight:600;padding:13px 0;color:var(--text);-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{cursor:pointer}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.item .es{font-weight:700;font-size:14.5px}
.item .p{font-size:12.5px;color:var(--accent-2);font-family:Unbounded;font-weight:500;margin-top:3px}
.item .a{margin-left:auto;font-size:19px;color:var(--muted);flex:none;max-width:45%;text-align:left}
.detail{padding:4px 0 14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.detail p{font-size:13.5px;color:#CFCBD9;line-height:1.5}
/* progreso */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .n{font-family:Unbounded;font-weight:800;font-size:25px}
.stat .t{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:4px}
.bars i.z{background:var(--surface2)}
.bars i.t{background:var(--saffron)}
.catbar{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;font-size:12px;font-weight:700;margin-top:11px}
.catbar span:last-child{color:var(--muted);text-align:right}
/* hojas (ajustes, guía) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .panel{background:var(--bg);border-top:1px solid var(--line);border-radius:26px 26px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:18px 20px calc(var(--sb) + 22px)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:grid;grid-template-columns:48px 34px 1fr}
.legend>div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center}
.legend .k{font-family:Unbounded;font-weight:700;color:var(--accent-2);font-size:15px}
.legend .l{font-family:"Noto Naskh Arabic","Geeza Pro";font-size:21px;color:var(--saffron);justify-content:center}
.legend .d{display:block!important;color:var(--text);font-weight:600;padding-left:8px;line-height:1.35;font-size:13.5px}
.legend .d em{display:block;color:var(--accent-2);font-style:normal;font-family:Unbounded;font-size:11px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-weight:600;font-size:14px}
.done-ico{width:84px;height:84px;border-radius:26px;background:var(--mint-soft);display:grid;place-items:center;margin:0 auto}
</style>
</head>
<body>
<div id="app">

  <!-- HOY -->
  <section class="view on" id="v-home"><div class="scroll stack" id="home"></div></section>

  <!-- EJERCICIOS -->
  <section class="view" id="v-ex"><div class="scroll stack" id="ex"></div></section>

  <!-- LISTADO -->
  <section class="view" id="v-list"><div class="scroll" id="list-scroll">
    <div class="row" style="margin-bottom:12px"><h2>Listado</h2><span class="sub" id="list-count"></span></div>
    <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Busca en español o darija" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div class="chips" id="list-chips" style="margin-top:12px;margin-bottom:6px"></div>
    <div id="list"></div>
  </div></section>

  <!-- PROGRESO -->
  <section class="view" id="v-prog"><div class="scroll stack" id="prog"></div></section>

  <!-- PANTALLA DE ESTUDIO (sesión, test, emparejar, libre) -->
  <section class="view" id="v-study"><div class="study" id="study"></div></section>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-v="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</button>
    <button class="tab" data-v="ex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Ejercicios</button>
    <button class="tab" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Listado</button>
    <button class="tab" data-v="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  </nav>
</div>

<!-- AJUSTES -->
<div class="sheet" id="sh-settings"><div class="panel stack" id="settings"></div></div>
<!-- GUÍA -->
<div class="sheet" id="sh-guide"><div class="panel">
  <div class="grab"></div>
  <div class="row"><h3>Cómo leer</h3><button class="close" data-close="sh-guide">✕</button></div>
  <p class="sub" style="margin:6px 0 8px;line-height:1.45">Se lee como en castellano, salvo esto:</p>
  <div class="legend" id="legend"></div>
  <p class="sub" style="margin-top:14px;line-height:1.5">Un guion une el artículo con la palabra: <b class="pr" style="color:var(--accent-2)">l-khobz</b> (el pan). Si la letra se repite, como en <b class="pr" style="color:var(--accent-2)">s-suq</b>, la l se ha fundido con ella y no se pronuncia.</p>
</div></div>

<div class="toast" id="toast"></div>

<script src="fsrs.js"></script>
<script>
'use strict';
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!.,()/]/g,' ').replace(/\s+/g,' ').trim();
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const endOfToday = () => { const d=new Date(); d.setHours(23,59,59,999); return d; };
const hash = s => { let h=2166136261; for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);} return Math.abs(h); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function fmtIv(ms){
  const m=ms/60000; if(m<1) return '<1 min'; if(m<60) return Math.round(m)+' min';
  const h=m/60; if(h<24) return Math.round(h)+' h';
  const d=h/24; if(d<30) return Math.round(d)+' d';
  const mo=d/30; if(mo<12) return (Math.round(mo*10)/10).toString().replace('.',',')+' m';
  return (Math.round(mo/12*10)/10).toString().replace('.',',')+' a';
}
const STAR = '<svg class="star" viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="3"><rect x="20" y="20" width="60" height="60"/><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="14"/></g></svg>';

/* ============ estado ============ */
const KEY = 'darija_v1';
const DEFAULT = () => ({ v:1, cards:{}, intro:{}, days:{}, extra:{}, flags:{}, settings:{ newPerDay:8, dir:'both' } });
let S = (() => { try { const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.cards) return Object.assign(DEFAULT(), s, {settings:Object.assign(DEFAULT().settings, s.settings||{})}); } catch(e){} return DEFAULT(); })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('No se ha podido guardar'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const F = FSRS.fsrs(FSRS.generatorParameters({ enable_fuzz:true, maximum_interval:365, request_retention:0.9 }));
const R = { again:1, hard:2, good:3, easy:4 };
function getCard(key){ const c=S.cards[key]; if(!c) return null; return Object.assign({}, c, { due:new Date(c.due), last_review: c.last_review ? new Date(c.last_review) : undefined }); }
function putCard(key,c){ S.cards[key] = Object.assign({}, c, { due:c.due.toISOString(), last_review: c.last_review ? new Date(c.last_review).toISOString() : null }); }
const dirs = () => S.settings.dir === 'p' ? ['p'] : ['r','p'];
function dayStat(){ const k=dayKey(); return S.days[k] || (S.days[k]={rev:0,ok:0,nw:0}); }

/* ============ datos ============ */
let ITEMS=[], BY={}, CATS=[], CATNAME={}, ORDER=[];
async function loadData(){
  const res = await fetch('darija.json');
  const d = await res.json();
  ITEMS = d.items; CATS = d.cats;
  CATS.forEach((c,i)=>{ CATNAME[c.id]=c.name; c.i=i; });
  const ci = Object.fromEntries(CATS.map(c=>[c.id,c.i]));
  ITEMS.forEach((it,i)=>{ BY[it.id]=it; it._i=i; it._n = norm(it.es+' '+it.pr+' '+(it.nota||'')); });
  ORDER = [...ITEMS].sort((a,b)=> a.lvl-b.lvl || ci[a.cat]-ci[b.cat] || a._i-b._i);
}

function status(id){
  const ks = dirs().map(d=>id+'|'+d);
  const cs = ks.map(k=>S.cards[k]).filter(Boolean);
  if(!cs.length) return 'new';
  if(cs.length===ks.length && cs.every(c=>c.state===2 && c.stability>=21)) return 'dom';
  return 'learn';
}
const STCOL = { new:'var(--dim)', learn:'var(--saffron)', dom:'var(--mint)' };
const STNAME = { new:'Sin ver', learn:'Aprendiendo', dom:'Dominada' };

function dueKeys(){
  const lim = endOfToday().getTime(); const ok = new Set(dirs());
  return Object.keys(S.cards).filter(k=>{ const [id,d]=k.split('|'); return BY[id] && ok.has(d) && new Date(S.cards[k].due).getTime()<=lim; })
    .sort((a,b)=> new Date(S.cards[a].due) - new Date(S.cards[b].due));
}
const introToday = () => Object.values(S.intro).filter(d=>d===dayKey()).length;
const newQuota = () => Math.max(0, S.settings.newPerDay + (S.extra[dayKey()]||0) - introToday());
const nextNew = n => ORDER.filter(it=>!S.intro[it.id]).slice(0,n);
function streak(){
  let n=0; const d=new Date();
  if(!(S.days[dayKey(d)]?.rev>0)) d.setDate(d.getDate()-1);
  while(S.days[dayKey(d)]?.rev>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function pool(){
  const seen = ITEMS.filter(it=>S.intro[it.id]);
  return seen.length>=8 ? seen : ORDER.slice(0,30);
}

/* ============ trucos de pronunciación ============ */
const TIPS = [
  [/3/, '<b>3</b> es la ع: un sonido de garganta apretada. Di una "a" apretando la garganta.'],
  [/7/, '<b>7</b> es la ح: una h fuerte, como cuando empañas un cristal.'],
  [/kh/, '<b>kh</b> es tu jota de siempre (خ).'],
  [/gh/, '<b>gh</b> suena como la r francesa (غ).'],
  [/q/, '<b>q</b> es una k que sale del fondo de la garganta (ق).'],
  [/sh/, '<b>sh</b> es la x catalana, la de «xocolata» (ش).'],
  [/(^|[^k])j/, '<b>j</b> es la j catalana, la de «jove». No es la jota (ج).'],
  [/z/, '<b>z</b> es una s que zumba. Nunca como la z castellana (ز).'],
  [/g(?!h)/, '<b>g</b> siempre suave, como en «gato», también delante de e o i.'],
  [/([bcdfgjklmnpqrstwyz])\1/, 'Las <b>letras dobles</b> se aguantan un poco más, como en bezzaf.'],
];
function tipFor(it){
  const p = it.pr.toLowerCase(); const hits = TIPS.filter(([re])=>re.test(p));
  if(!hits.length) return '';
  return hits[hash(it.id)%hits.length][1].replace(/<b>/g,'<b class="pr" style="color:var(--accent-2)">');
}

/* ============ SESIÓN (repaso espaciado) ============ */
let SES=null;
function startSession(){
  const q = dueKeys().map(k=>({key:k}));
  const fresh = nextNew(newQuota());
  if(dirs().includes('r')) fresh.forEach(it=>q.push({key:it.id+'|r', nuevo:true}));
  fresh.forEach(it=>q.push({key:it.id+'|p', nuevo:true}));
  if(!q.length){ toast('No hay nada pendiente'); return; }
  SES = { q, done:0, ok:0, again:0, shown:false, mode:'srs' };
  go('study'); drawCard();
}
function startFree(cat){
  const its = shuffle(ITEMS.filter(it=>cat==='_flags' ? S.flags[it.id] : it.cat===cat));
  if(!its.length){ toast('No hay tarjetas aquí'); return; }
  SES = { q: its.map(it=>({key:it.id+'|p'})), done:0, ok:0, again:0, shown:false, mode:'free', title: cat==='_flags'?'Dudosas':CATNAME[cat] };
  go('study'); drawCard();
}
function exitStudy(){ SES=null; TEST=null; MATCH=null; clearInterval(MATCH_T); go(prevTab||'home'); }
let prevTab='home';
function studyTop(label, frac){
  return `<div class="row" style="margin-bottom:10px"><button class="close" id="b-x">✕</button><span class="sub">${label}</span></div>
  <div class="progress"><i style="width:${Math.round(frac*100)}%"></i></div>`;
}
function drawCard(){
  const el=$('#study');
  if(!SES.q.length) return drawEnd();
  const {key, nuevo} = SES.q[0]; const [id, d] = key.split('|'); const it = BY[id];
  const left = new Set(SES.q.map(x=>x.key)).size;
  const total = SES.done + left;
  const label = SES.mode==='free' ? `${esc(SES.title)} · quedan ${left}` : `Quedan ${left}`;
  const flagged = !!S.flags[id];
  let front, back='';
  if(d==='p'){
    front = `<span class="chip accent">${nuevo?'Nueva · ':''}Español → Darija</span>
      <div class="qes">${esc(it.es)}</div>
      ${SES.shown?'':`<div class="sub" style="max-width:240px;line-height:1.5">Dilo en voz alta antes de darle la vuelta</div>`}`;
  } else {
    front = `<span class="chip accent">${nuevo?'Nueva · ':''}Darija → Español</span>
      <div class="pr qpr">${esc(it.pr)}</div><div class="ar qar">${esc(it.ar)}</div>
      ${SES.shown?'':`<div class="sub">¿Qué significa?</div>`}`;
  }
  if(SES.shown){
    const tip = tipFor(it);
    back = d==='p'
      ? `<div class="pr qpr" style="margin-top:6px">${esc(it.pr)}</div><div class="ar qar">${esc(it.ar)}</div>`
      : `<div class="qes" style="font-size:24px;margin-top:6px">${esc(it.es)}</div>`;

    if(tip) back += `<div class="card tip"><div class="t">Truco</div><p>${tip}</p></div>`;
    back += `<button class="flag ${flagged?'on':''}" id="b-flag">${flagged?'⚑ Marcada como dudosa':'⚑ Marcar como dudosa'}</button>`;
    if(d==='p') front = `<div class="sub" style="font-size:15px">${esc(it.es)}</div>`;
  }
  let foot;
  if(!SES.shown) foot = `<button class="btn" id="b-show">Mostrar respuesta</button>`;
  else if(SES.mode==='free') foot = `<div class="answer" style="grid-template-columns:1fr 1fr">
      <button class="ans" style="background:var(--red-soft);color:var(--red)" data-free="0">Otra vez</button>
      <button class="ans" style="background:var(--mint-soft);color:var(--mint)" data-free="1">La sé</button></div>`;
  else {
    const now=new Date(); const c=getCard(key)||FSRS.createEmptyCard(now); const prev=F.repeat(c,now);
    const iv = g => fmtIv(prev[g].card.due - now);
    foot = `<div class="answer">
      <button class="ans" style="background:var(--red-soft);color:var(--red)" data-g="1">Otra vez<small>${iv(1)}</small></button>
      <button class="ans" style="background:var(--saffron-soft);color:var(--saffron)" data-g="2">Difícil<small>${iv(2)}</small></button>
      <button class="ans" style="background:var(--mint-soft);color:var(--mint)" data-g="3">Bien<small>${iv(3)}</small></button>
      <button class="ans" style="background:var(--accent-soft);color:var(--accent-2)" data-g="4">Fácil<small>${iv(4)}</small></button></div>`;
  }
  el.innerHTML = `${studyTop(label, SES.done/total)}<div class="face">${front}${back}</div>${foot}`;
  $('#b-x').onclick = exitStudy;
  if($('#b-show')) $('#b-show').onclick = ()=>{ SES.shown=true; drawCard(); };
  if($('#b-flag')) $('#b-flag').onclick = ()=>{ if(S.flags[id]) delete S.flags[id]; else S.flags[id]=dayKey(); save(); drawCard(); };
  el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>rate(+b.dataset.g));
  el.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{
    const cur=SES.q.shift(); SES.shown=false;
    if(b.dataset.free==='0'){ SES.again++; SES.q.splice(Math.min(SES.q.length,3),0,cur); } else { SES.done++; SES.ok++; }
    drawCard();
  });
}
function rate(g){
  const now=new Date(); const cur=SES.q.shift(); const key=cur.key; const id=key.split('|')[0];
  const c=getCard(key)||FSRS.createEmptyCard(now);
  const nc=F.repeat(c,now)[g].card;
  putCard(key,nc);
  const ds=dayStat(); ds.rev++; if(g>=3) ds.ok++;
  if(!S.intro[id]){ S.intro[id]=dayKey(); ds.nw++; }
  if(g===1) SES.again++; else SES.ok++;
  // si vuelve a tocar en menos de una hora, se repite en esta misma sesión
  if(nc.due.getTime() - now.getTime() < 60*60*1000){
    const pos = g===1 ? Math.min(SES.q.length,3) : SES.q.length;
    SES.q.splice(pos,0,{key});
  } else SES.done++;
  SES.shown=false; save(); drawCard();
}
function drawEnd(){
  const free = SES.mode==='free';
  $('#study').innerHTML = `

/* ============ TEST RÁPIDO ============ */
let TEST=null;
function startTest(){
  const p = shuffle(pool()).slice(0,10);
  TEST = { qs: p.map(it=>makeQ(it)), i:0, ok:0, answered:false };
  go('study'); drawTest();
}
function makeQ(it){
  const dir = Math.random()<.5 ? 'r':'p';
  const val = x => dir==='r' ? x.es : x.pr;
  const same = shuffle(ITEMS.filter(x=>x.cat===it.cat && x.id!==it.id && val(x)!==val(it)));
  const other = shuffle(ITEMS.filter(x=>x.cat!==it.cat && val(x)!==val(it)));
  const ds=[]; for(const x of [...same,...other]){ if(ds.length===3) break; if(!ds.some(y=>val(y)===val(x))) ds.push(x); }
  return { it, dir, opts: shuffle([it,...ds]) };
}
function drawTest(){
  const T=TEST; const el=$('#study');
  if(T.i>=T.qs.length){
    el.innerHTML = `<div class="face" style="gap:16px">
      <div class="done-ico" style="background:var(--accent-soft)"><span class="big" style="font-size:30px;color:var(--accent-2)">${T.ok}/${T.qs.length}</span></div>
      <h2>${T.ok>=9?'Wa3er!':T.ok>=6?'Mzyan!':'Shwiya b shwiya'}</h2>
      <div class="sub" style="line-height:1.5;max-width:260px">${T.ok>=9?'Casi perfecto.':T.ok>=6?'Vas bien. Lo que has fallado volverá a salir en tus repasos.':'Poco a poco. Repasa estas en la sesión diaria.'}</div></div>
      <div class="stack" style="gap:10px"><button class="btn" id="b-again">Otro test</button><button class="btn ghost" id="b-end">Volver</button></div>`;
    $('#b-again').onclick=startTest; $('#b-end').onclick=exitStudy; return;
  }
  const q=T.qs[T.i]; const it=q.it;
  const prompt = q.dir==='r'
    ? `<div class="sub">¿Qué significa?</div><div class="pr qpr" style="margin-top:6px">${esc(it.pr)}</div><div class="ar qar" style="color:var(--muted)">${esc(it.ar)}</div>`
    : `<div class="sub">¿Cómo se dice?</div><div class="qes" style="margin-top:6px">${esc(it.es)}</div>`;
  const opts = q.opts.map((o,k)=>{
    let cls='';
    if(T.answered){ if(o.id===it.id) cls='ok'; else if(k===T.pick) cls='ko'; }
    const label = q.dir==='r' ? esc(o.es) : `<span class="pr" style="font-size:14px">${esc(o.pr)}</span><span class="ar">${esc(o.ar)}</span>`;
    return `<button class="opt ${cls}" data-k="${k}">${label}</button>`;
  }).join('');
  el.innerHTML = `<div class="row" style="margin-bottom:10px"><button class="close" id="b-x">✕</button><span class="chip mint">${T.ok} / ${T.i+(T.answered?1:0)} bien</span></div>
    <div class="progress"><i style="width:${(T.i+(T.answered?1:0))/T.qs.length*100}%;background:var(--mint)"></i></div>
    <div style="text-align:center;padding:26px 0 18px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:none">${prompt}</div>
    <div class="stack" style="gap:9px;flex:1;overflow-y:auto">${opts}</div>
    ${T.answered?`<button class="btn" id="b-next" style="margin-top:12px">${T.i+1<T.qs.length?'Siguiente':'Ver resultado'}</button>`:''}`;
  $('#b-x').onclick=exitStudy;
  if(!T.answered) el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    T.pick=+b.dataset.k; T.answered=true; if(q.opts[T.pick].id===it.id) T.ok++; drawTest();
  });
  if($('#b-next')) $('#b-next').onclick=()=>{ T.i++; T.answered=false; T.pick=null; drawTest(); };
}

/* ============ EMPAREJAR ============ */
let MATCH=null, MATCH_T=null;
function startMatch(){
  const p=pool(); const byCat={}; p.forEach(it=>(byCat[it.cat]=byCat[it.cat]||[]).push(it));
  const cats=Object.keys(byCat).filter(c=>new Set(byCat[c].map(x=>x.pr)).size>=5);
  let src, title;
  if(cats.length){ const c=cats[Math.floor(Math.random()*cats.length)]; src=byCat[c]; title=CATNAME[c]; } else { src=p; title='Mezcla'; }
  const pick=[]; for(const it of shuffle(src)){ if(pick.length===5) break; if(!pick.some(x=>x.pr===it.pr||x.es===it.es)) pick.push(it); }
  MATCH={ pick, L:shuffle(pick), Rr:shuffle(pick), done:new Set(), sel:null, start:Date.now(), title, errors:0 };
  go('study'); drawMatch();
  clearInterval(MATCH_T); MATCH_T=setInterval(()=>{ const t=$('#m-time'); if(t&&MATCH) t.textContent=mmss(Date.now()-MATCH.start); },1000);
}
const mmss = ms => { const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${pad(s%60)}`; };
function drawMatch(){
  const M=MATCH; const el=$('#study');
  if(M.done.size===M.pick.length){
    clearInterval(MATCH_T);
    el.innerHTML=`<div class="face" style="gap:16px"><div class="done-ico" style="background:var(--saffron-soft)"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F5B53D" stroke-width="2.4"><rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="13" width="7" height="7" rx="2"/><path d="M10 7.5h4a3 3 0 0 1 3 3V13"/></svg></div>
      <h2>Hecho en ${mmss(Date.now()-M.start)}</h2><div class="sub">${M.errors} ${M.errors===1?'fallo':'fallos'}</div></div>
      <div class="stack" style="gap:10px"><button class="btn" id="b-again">Otra ronda</button><button class="btn ghost" id="b-end">Volver</button></div>`;
    $('#b-again').onclick=startMatch; $('#b-end').onclick=exitStudy; return;
  }
  const cell=(it,side)=>{ const d=M.done.has(it.id); const s=M.sel&&M.sel.side===side&&M.sel.id===it.id;
    return `<button class="m ${side==='r'?'r':''} ${d?'done':''} ${s?'sel':''}" data-side="${side}" data-id="${it.id}">${esc(side==='l'?it.es:it.pr)}</button>`; };
  let grid=''; for(let k=0;k<M.pick.length;k++) grid+=cell(M.L[k],'l')+cell(M.Rr[k],'r');
  el.innerHTML=`<div class="row" style="margin-bottom:6px"><button class="close" id="b-x">✕</button><span class="sub" id="m-time">${mmss(Date.now()-M.start)}</span></div>
    <div style="margin:4px 0 16px"><h3>Une las parejas</h3><div class="sub" style="margin-top:4px">${esc(M.title)}</div></div>
    <div class="match">${grid}</div>
    <div style="flex:1"></div>
    <div class="card" style="display:flex;gap:12px;align-items:center"><span class="chip accent">${M.done.size} / ${M.pick.length}</span><span class="sub">Toca una palabra de cada lado</span></div>`;
  $('#b-x').onclick=exitStudy;
  el.querySelectorAll('.m').forEach(b=>b.onclick=()=>{
    const side=b.dataset.side, id=b.dataset.id;
    if(!M.sel || M.sel.side===side){ M.sel={side,id}; return drawMatch(); }
    if(M.sel.id===id){ M.done.add(id); M.sel=null; return drawMatch(); }
    M.errors++; const other=el.querySelector(`.m[data-side="${M.sel.side}"][data-id="${M.sel.id}"]`);
    b.classList.add('bad'); other&&other.classList.add('bad'); M.sel=null;
    setTimeout(drawMatch,420);
  });
}

    <button class="tile" id="e-test"><div class="ico" style="background:var(--mint-soft)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.4"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></div><h4>Test rápido</h4><p>10 preguntas tipo test</p></button>
    <button class="tile" id="e-match"><div class="ico" style="background:var(--saffron-soft)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5B53D" stroke-width="2.4"><rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="13" width="7" height="7" rx="2"/><path d="M10 7.5h4a3 3 0 0 1 3 3V13"/></svg></div><h4>Emparejar</h4><p>5 parejas contra el reloj</p></button>
  </div>
  <p class="sub" style="line-height:1.5">Test y emparejar usan lo que ya has visto${ITEMS.some(it=>S.intro[it.id])?'':' (de momento, las primeras palabras)'}. No cambian tu calendario de repasos.</p>
  ${nflags?`<button class="card row" id="e-flags" style="width:100%;text-align:left"><div><div style="font-weight:800">Tarjetas dudosas</div><div class="sub" style="margin-top:3px">Las que has marcado para revisar</div></div><span class="chip saffron">${nflags}</span></button>`:''}
  <div><h3 style="margin:6px 0 4px">Repaso libre por tema</h3><p class="sub" style="line-height:1.5">Pasa tarjetas de un tema cuando quieras, sin afectar al calendario.</p></div>
  <div class="card" style="padding:4px 16px">
    ${seenCats.map(({c,n,s})=>`<button class="item" data-cat="${c.id}" style="border-bottom:1px solid var(--line)"><div><div class="es">${esc(c.name)}</div><div class="sub" style="margin-top:3px;font-size:12px">${s} de ${n} vistas</div></div><span class="a" style="font-size:18px;color:var(--dim)">›</span></button>`).join('')}
  </div>`;
  $('#e-test').onclick=()=>{prevTab='ex';startTest();};
  $('#e-match').onclick=()=>{prevTab='ex';startMatch();};
  if($('#e-flags')) $('#e-flags').onclick=()=>{prevTab='ex';startFree('_flags');};
  $('#ex').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{prevTab='ex';startFree(b.dataset.cat);});
}

/* ============ LISTADO ============ */
let LF={cat:'all', q:'', open:null};
function renderList(){
  const chips=[['all','Todo'],['_flags','Dudosas'],...CATS.map(c=>[c.id,c.name])];
  $('#list-chips').innerHTML = chips.map(([id,n])=>`<span class="chip ${LF.cat===id?'accent':'ghost'}" data-c="${id}">${esc(n)}</span>`).join('');
  $('#list-chips').querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>{ LF.cat=c.dataset.c; LF.open=null; renderList(); });
  drawRows();
}
function drawRows(){
  const qn=norm(LF.q); const qa=LF.q.trim();
  let rows=ITEMS.filter(it=> LF.cat==='all' || (LF.cat==='_flags'? S.flags[it.id] : it.cat===LF.cat));
  if(qn||qa) rows=rows.filter(it=> (qn && it._n.includes(qn)) || (qa && it.ar.includes(qa)));
  $('#list-count').textContent = rows.length;
  if(!rows.length){ $('#list').innerHTML=`<div class="empty">${LF.cat==='_flags'?'No has marcado ninguna tarjeta como dudosa.':'Nada por aquí.'}</div>`; return; }
  $('#list').innerHTML = rows.map(it=>{
    const st=status(it.id); const open=LF.open===it.id;
    return `<button class="item" data-id="${it.id}" ${open?'style="border-bottom:none"':''}><span class="dot" style="background:${STCOL[st]}"></span><div><div class="es">${esc(it.es)}</div><div class="p">${esc(it.pr)}</div></div><div class="a ar">${esc(it.ar)}</div></button>`
     + (open?`<div class="detail">${it.nota?`<p>${esc(it.nota)}</p>`:''}
        <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><span class="chip ghost">${esc(CATNAME[it.cat])}</span><span class="chip ghost">Nivel ${it.lvl}</span><span class="chip" style="background:var(--surface2);color:${STCOL[st]}">${STNAME[st]}</span></div>
        <button class="flag ${S.flags[it.id]?'on':''}" data-flag="${it.id}" style="align-self:flex-start">${S.flags[it.id]?'⚑ Marcada como dudosa':'⚑ Marcar como dudosa'}</button></div>`:'');
  }).join('');
}
$('#list').addEventListener('click',e=>{
  const f=e.target.closest('[data-flag]'); if(f){ const id=f.dataset.flag; if(S.flags[id]) delete S.flags[id]; else S.flags[id]=dayKey(); save(); drawRows(); return; }
  const r=e.target.closest('.item'); if(r){ LF.open = LF.open===r.dataset.id?null:r.dataset.id; drawRows(); }
});
$('#q').addEventListener('input',e=>{ LF.q=e.target.value; LF.open=null; drawRows(); });

/* ============ PROGRESO ============ */
function renderProg(){
  const st={new:0,learn:0,dom:0}; const per={};
  ITEMS.forEach(it=>{ const s=status(it.id); st[s]++; const p=per[it.cat]||(per[it.cat]={n:0,learn:0,dom:0}); p.n++; if(s!=='new') p[s]++; });
  const days=[]; for(let k=13;k>=0;k--){ const d=new Date(); d.setDate(d.getDate()-k); days.push({k:dayKey(d), v:S.days[dayKey(d)]?.rev||0, today:k===0}); }
  const max=Math.max(10,...days.map(d=>d.v));
  const total=Object.values(S.days).reduce((a,d)=>a+(d.rev||0),0);
  const okr=Object.values(S.days).reduce((a,d)=>a+(d.ok||0),0);
  const sk=streak();
  $('#prog').innerHTML=`<h2>Progreso</h2>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="stat"><div class="n" style="color:var(--mint)">${st.dom}</div><div class="t">Dominadas</div></div>
    <div class="stat"><div class="n" style="color:var(--saffron)">${st.learn}</div><div class="t">Aprendiendo</div></div>
    <div class="stat"><div class="n">${st.new}</div><div class="t">Por ver</div></div>
  </div>
  <div class="card">
    <div class="row"><span style="font-weight:800;font-size:14px">Últimos 14 días</span><span class="chip saffron">${sk} ${sk===1?'día seguido':'días seguidos'}</span></div>
    <div class="bars" style="margin-top:14px">${days.map(d=>`<div><i class="${d.v?'':'z'} ${d.today&&d.v?'t':''}" style="height:${d.v?Math.max(8,d.v/max*100):6}%"></i></div>`).join('')}</div>
    <div class="row sub" style="margin-top:12px;font-size:12px"><span>${total} repasos en total</span><span>${total?Math.round(okr/total*100):0}% acertados</span></div>
  </div>
  <div class="card">
    <span style="font-weight:800;font-size:14px">Por tema</span>
    <div class="sub" style="font-size:11.5px;margin-top:4px"><span style="color:var(--mint)">■</span> dominadas · <span style="color:var(--accent-2)">■</span> aprendiendo</div>
    ${CATS.map(c=>{ const p=per[c.id]; return `<div class="catbar"><span>${esc(c.name)}</span><div class="progress"><i style="width:${p.dom/p.n*100}%;background:var(--mint);border-radius:0"></i><i style="width:${p.learn/p.n*100}%;border-radius:0"></i></div><span>${p.dom+p.learn}/${p.n}</span></div>`; }).join('')}
  </div>`;
}

/* ============ AJUSTES ============ */
function renderSettings(){
  const n=S.settings.newPerDay;
  $('#settings').innerHTML=`<div class="grab"></div>
  <div class="row"><h3>Ajustes</h3><button class="close" data-close="sh-settings">✕</button></div>
  <div><div style="font-weight:800;margin-bottom:8px">Frases nuevas al día</div>
    <div class="seg" id="s-new">${[5,8,10,15,20].map(v=>`<button class="${v===n?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="sub" style="margin-top:6px;line-height:1.45">Cada frase nueva genera ${dirs().length===2?'dos tarjetas (una en cada sentido)':'una tarjeta'}. Con 8 al día, en unos 3 meses y medio has visto la base entera.</div></div>
  <div><div style="font-weight:800;margin-bottom:8px">Sentido de las tarjetas</div>
    <div class="seg" id="s-dir"><button class="${S.settings.dir==='both'?'on':''}" data-v="both">Los dos</button><button class="${S.settings.dir==='p'?'on':''}" data-v="p">Solo español → darija</button></div></div>
  <button class="btn ghost" id="s-guide">Guía de pronunciación</button>
  <div class="card stack" style="gap:10px">
    <div style="font-weight:800">Copia de seguridad</div>
    <div class="sub" style="line-height:1.5">Tu progreso vive en este iPhone. Si borras la app o los datos de Safari, se pierde. Exporta una copia de vez en cuando y guárdala en Archivos o en Drive.</div>
    <button class="btn" id="s-exp">Exportar copia</button>
    <button class="btn ghost" id="s-imp">Importar copia</button>
    <input type="file" id="s-file" accept=".json,application/json" style="display:none">
  </div>
  <button class="btn danger" id="s-reset">Borrar todo el progreso</button>
  <div class="sub" style="text-align:center;font-size:11.5px">${ITEMS.length} entradas en la base · ${Object.keys(S.cards).length} tarjetas empezadas</div>`;
  openSheet('sh-settings');
  $('#s-new').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.settings.newPerDay=+b.dataset.v; save(); renderSettings(); renderHome(); });
  $('#s-dir').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.settings.dir=b.dataset.v; save(); renderSettings(); renderHome(); });
  $('#s-guide').onclick=()=>{ closeSheet('sh-settings'); openSheet('sh-guide'); };
  $('#s-exp').onclick=exportData;
  $('#s-imp').onclick=()=>$('#s-file').click();
  $('#s-file').onchange=importData;
  let armed=false;
  $('#s-reset').onclick=e=>{
    if(!armed){ armed=true; e.target.textContent='Toca otra vez para confirmar'; setTimeout(()=>{armed=false; if($('#s-reset')) $('#s-reset').textContent='Borrar todo el progreso';},3000); return; }
    S=DEFAULT(); save(); closeSheet('sh-settings'); go('home'); toast('Progreso borrado');
  };
}
async function exportData(){
  const name=`darija-copia-${dayKey()}.json`;
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('Copia descargada');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.cards||!d.intro) throw 0;
      S=Object.assign(DEFAULT(),d,{settings:Object.assign(DEFAULT().settings,d.settings||{})}); save(); closeSheet('sh-settings'); go('home'); toast('Copia importada');
    }catch(err){ toast('Ese archivo no es una copia válida'); } };
  r.readAsText(f); e.target.value='';
}

/* ============ arranque ============ */
loadData().then(()=>{ go('home'); }).catch(()=>{ $('#home').innerHTML='<div class="empty">No se ha podido cargar la base de datos. Abre la app con conexión una vez.</div>'; });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && current!=='study' && ITEMS.length) go(current); });
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
